[project]
name = "transformers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lê Thiện Đức", email = "thienduc1092005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch",
    "tensorflow-cpu",
    "keras",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "nltk",
    "sacrebleu",
    "tqdm",
    "gdown",
    "ipykernel",
    "nbclient",
    "nbconvert",
]

[project.scripts]
transformers = "transformers:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
